{% load static %}
{% load i18n %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Management System - {% trans "Password Reset Complete" %}</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'plugins/tempusdominus-bootstrap-4/css/tempusdominus-bootstrap-4.min.css' %}">
    <!-- Theme style -->
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
    <!-- Google Font: Source Sans Pro -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
    
    <style>
        body {
            background-color: #000;
            color: #e0e0e0;
            font-family: 'Source Sans Pro', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 15px;
        }
        
        .card {
            background-color: #222;
            border: none;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }
        
        .card-header {
            background-color: #181818;
            border-bottom: 1px solid #333;
            padding: 15px 20px;
        }
        
        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .alert-success {
            background-color: #2a3f2b;
            border-color: #28a745;
            color: #fff;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
            border-color: #bd2130;
        }
        
        .text-center {
            text-align: center;
        }
        
        @media (max-width: 576px) {
            .auth-container {
                padding: 10px;
            }
            
            .card-body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title">{% trans "Password Reset Complete" %}</h5>
            </div>
            <div class="card-body text-center">
                <div class="alert alert-success">
                    <i class="fas fa-check-circle fa-3x d-block mx-auto mb-3"></i>
                    <p>{% trans "Sua senha foi alterada com sucesso!" %}</p>
                    <p>{% trans "Você pode prosseguir e fazer login agora." %}</p>
                </div>
                <div class="mt-4">
                    <a href="{% url 'focusbjj:login' %}" class="btn btn-danger btn-lg">
                        <i class="fas fa-sign-in-alt mr-1"></i> {% trans "Login" %}
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- jQuery -->
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <!-- Bootstrap 4 -->
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- Sweet Alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</body>
</html>
