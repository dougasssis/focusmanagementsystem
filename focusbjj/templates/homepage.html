<!DOCTYPE html>
{% load static %}
{% load crispy_forms_tags %}
{% load i18n %}

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Focus Jiu-Jitsu - Check In" %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css'%}">
  <style>
    :root {
      --primary-color: #dc3545;
      --primary-hover: #c82333;
      --text-light: #f8f9fa;
      --text-dark: #212529;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    .check-in-wrapper {
      display: flex;
      height: 100vh;
      position: relative;
      z-index: 1;
    }
    
    .left-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: #111; /* Dark background for left section */
      position: relative;
      overflow: hidden;
    }
    
    .left-section::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23333333' fill-opacity='0.2' fill-rule='evenodd'%3E%3Ccircle cx='3' cy='3' r='3'/%3E%3Ccircle cx='13' cy='13' r='3'/%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.3;
      z-index: -1;
    }
    
    .left-content {
      text-align: center;
      max-width: 400px;
    }
    
    .check-in-header {
      margin-bottom: 2rem;
    }
    
    .check-in-title {
      color: var(--text-light);
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    .check-in-subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1rem;
    }
    
    .right-section {
      flex: 1;
      background: rgba(30, 30, 30, 0.95);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem;
      position: relative;
      overflow: hidden;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .right-section::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23333333' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      z-index: -1;
      opacity: 0.2;
    }
    
    .form-container {
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
    }
    
    .id-label {
      display: block;
      color: var(--text-light);
      margin-bottom: 0.75rem;
      font-weight: 500;
      font-size: 1.1rem;
    }
    
    .id-input {
      width: 100%;
      padding: 1rem 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-light);
      font-size: 1.5rem;
      letter-spacing: 8px;
      text-align: center;
      transition: all 0.3s;
      margin-bottom: 2rem;
    }
    
    .id-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.25);
    }
    
    .id-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: normal;
      font-size: 0.9rem;
    }
    
    .check-in-btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      background: var(--primary-color);
      color: var(--text-light);
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    
    .check-in-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
    }
    
    .greeting {
      font-style: italic;
      text-align: center;
      margin: 1.5rem 0;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
    }
    
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .footer-link {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      transition: color 0.3s;
    }
    
    .footer-link:hover {
      color: var(--primary-color);
    }
    
    .footer-link i {
      margin-right: 0.5rem;
    }
    
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }
    
    .notification.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    .notification.success {
      background-color: #28a745;
    }
    
    .notification.error {
      background-color: #dc3545;
    }
    
    .notification i {
      margin-right: 10px;
    }
    
    @media (max-width: 768px) {
      .check-in-wrapper {
        flex-direction: column;
      }
      
      .left-section {
        padding: 2rem 1rem;
        flex: 0 0 auto;
        height: 40vh;
      }
      
      .right-section {
        padding: 2rem 1.5rem;
        flex: 1;
      }
      
      .check-in-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div id="notification-container"></div>
  
  <div class="check-in-wrapper">
    <div class="left-section">
      <div class="left-content">
        <div class="check-in-header">
          <h1 class="check-in-title">{% trans "Student Check-in" %}</h1>
          <p class="check-in-subtitle">{% trans "Focus Jiu-Jitsu Academy" %}</p>
        </div>
        
        <div class="greeting">
          {% trans "E tenha um bom treino. Oss!" %}
        </div>
      </div>
    </div>
    
    <div class="right-section">
      <div class="form-container">
        <form method="post" id="check-in-form">
          {% csrf_token %}
          
          <label for="id_aluno" class="id-label">{% trans "Member ID" %}:</label>
          <input 
            type="text" 
            name="aluno" 
            id="id_aluno" 
            class="id-input" 
            placeholder="{% trans 'Enter 4-digit ID' %}" 
            maxlength="4" 
            pattern="\d{4}" 
            required 
            inputmode="numeric" 
            autocomplete="off"
            autofocus
          >
          
          <button type="submit" class="check-in-btn">
            <i class="fas fa-sign-in-alt mr-2"></i> {% trans "Check In" %}
          </button>
        </form>
        
        <div class="footer-links">
          <a href="{% url 'focusbjj:filiais' %}" class="footer-link">
            <i class="fas fa-tachometer-alt"></i> {% trans "Dashboard" %}
          </a>
          <a href="{% url 'focusbjj:add_aluno' %}" class="footer-link">
            <i class="fas fa-user-plus"></i> {% trans "Register" %}
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Numbers only for ID input
      var idInput = document.getElementById('id_aluno');
      idInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
      
      // Function to show notifications
      function showNotification(message, type) {
        var container = document.getElementById('notification-container');
        
        var notification = document.createElement('div');
        notification.className = 'notification ' + type;
        
        var icon = type === 'success' ? 'check-circle' : 'exclamation-circle';
        notification.innerHTML = 
          '<i class="fas fa-' + icon + '"></i>' +
          '<span>' + message + '</span>';
        
        container.appendChild(notification);
        
        setTimeout(function() {
          notification.classList.add('show');
        }, 10);
        
        setTimeout(function() {
          notification.classList.remove('show');
          setTimeout(function() {
            if (notification.parentNode) {
              container.removeChild(notification);
            }
          }, 300);
        }, 4000);
      }
      
      // Process Django messages
      {% if messages %}
        {% for message in messages %}
          showNotification("{{ message }}", "{{ message.tags }}");
        {% endfor %}
      {% endif %}
    });
  </script>
</body>
</html>
